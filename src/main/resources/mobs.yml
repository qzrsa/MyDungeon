# ============================================================
#  怪模板（v0.3.14）
# ------------------------------------------------------------
#  档位：
#    tier1  普通杂兵   —— 第 1~5 层
#    tier2  中级怪     —— 第 4~7 层
#    tier3  强敌       —— 第 6~8 层
#    elite  精英       —— 第 8~20 层
#    boss   首领       —— 第 9、10、15、19、20 层（boss: true 才显示顶部血条）
#
#  health / damage / armor 会再乘一次 config.yml 里的 mobs.*-scale
#  同一层请只放 1 个 boss: true 的怪 —— 血条只跟踪第一个
#
#  ★ buffs = 怪永久携带的药水效果，格式「效果名: 等级」，等级从 0 起（0 = I 级）
#    常用：speed / resistance（减伤）/ strength（增伤）/ fire_resistance
#          regeneration（回血）/ absorption（额外血）/ jump_boost / invisibility
#    ⚠ resistance 与 strength 的数值折算写在 config.yml 的 combat.buff-*-per-level，
#      因为副本伤害由本插件引擎 setDamage() 接管，原版不会自动应用这两个效果
#    ★ config.yml 的 mobs.tier-buffs 还会按层数再叠一层 buff，与本表合并、同种取更高级
#
#  设计约束（副本引擎相关，改怪种类时请遵守）：
#   1. 副本怪只吃玩家伤害，其余伤害源一律免除，不怕火烧 / 摔落 / 互炸
#   2. 远程怪与投掷物的伤害会自动追溯到发射者，同样走 RPG 公式
#   3. CREEPER 的爆炸伤害直接用下表 damage 值，不按原版爆心距离衰减
#   4. 别用会「转化 / 攻击同类」的怪（HOGLIN 在主世界会变 ZOGLIN、WITHER 会打其他怪），
#      它们会把关卡流程搅乱
# ============================================================

