# ============================================================
#  副本关卡编排 —— 三十层试炼（v0.4.0）
#  规则：按顺序执行，当前层的怪全部清空后，才进入下一层。
#  type: WAVE = 普通层；BOSS = 首领层（顶部显示 BossBar）
#  注意：同一层里请只放 1 个 boss: true 的怪 —— 血条只跟踪第一个。
#
#  难度曲线由三层叠加而成：
#    ① 层数血量 —— config.yml 的 mobs.layer-health-step（第 N 层保底 +N×step）
#    ② 模板 buff —— mobs.yml 里每个怪自带的药水效果
#    ③ 层数 buff —— config.yml 的 mobs.tier-buffs（6 / 11 / 16 层各上一档）
#  所以越往后不只是怪更多，而是「更肉 + 更快 + 减伤」三管齐下。
#
#  ④ 绝对血量覆盖（v0.3.15）—— spawn 条目可写 hp: <数字> 钉死单只怪的绝对血量，
#     此时忽略模板血量与层数加成。用于让 BOSS 血量精确可控。
#
#  v0.3.14：10 → 20 层；v0.3.15：20 层 BOSS 钉死 200W。
#  v0.4.0：20 → 30 层，新增 21~30 层；第 20 层保留 200W 中期 BOSS，
#          最终 BOSS 移到第 30 层（钉死 300W）。
# ============================================================

id: dungeon1
name: '&6遗忘地窟 · 三十层试炼'

stages:
  # ================= 第一幕 · 前哨（1~5 层）=================
  - type: WAVE
    name: '&e第 1 层 · 入口守卫'
    spawns:
      - { mob: grunt, count: 20 }

  - type: WAVE
    name: '&e第 2 层 · 弓手哨卡'
    spawns:
      - { mob: grunt, count: 14 }
      - { mob: archer, count: 10 }

  - type: WAVE
    name: '&e第 3 层 · 蛛巢'
    spawns:
      - { mob: husk, count: 12 }
      - { mob: spider, count: 10 }

  - type: WAVE
    name: '&6第 4 层 · 溺亡回廊'
    spawns:
      - { mob: drowned, count: 12 }
      - { mob: stray, count: 8 }
      - { mob: spider, count: 8 }

  - type: WAVE
    name: '&6第 5 层 · 爆破区'
    spawns:
      - { mob: creeper, count: 8 }
      - { mob: silverfish, count: 16 }
      - { mob: husk, count: 10 }

  # ================= 第二幕 · 熔炉与祭坛（6~8 层）=================
  - type: WAVE
    name: '&6第 6 层 · 熔岩熔炉'
    spawns:
      - { mob: piglin, count: 12 }
      - { mob: blaze, count: 8 }
      - { mob: creeper, count: 6 }

  - type: WAVE
    name: '&6第 7 层 · 女巫祭坛'
    spawns:
      - { mob: witch, count: 6 }
      - { mob: cave_spider, count: 12 }
      - { mob: stray, count: 10 }

  - type: WAVE
    name: '&c第 8 层 · 精英前哨'
    spawns:
      - { mob: elite_brute, count: 6 }
      - { mob: elite_marksman, count: 6 }
      - { mob: elite_vex, count: 10 }

  # ================= 第三幕 · 双子首领（9~10 层）=================
  - type: BOSS
    name: '&4第 9 层 · 典狱长'
    spawns:
      - { mob: boss_warden, count: 1 }
      - { mob: elite_piglin_brute, count: 6 }
      - { mob: elite_ravager, count: 3 }

  - type: BOSS
    name: '&4&l第 10 层 · 终末之厅'
    spawns:
      - { mob: boss_ravager, count: 1 }
      - { mob: elite_vex, count: 10 }
      - { mob: elite_marksman, count: 8 }

  # ================= 第四幕 · 深入（11~14 层）=================
  - type: WAVE
    name: '&c第 11 层 · 弩炮长廊'
    spawns:
      - { mob: elite_pillager, count: 8 }
      - { mob: archer, count: 14 }
      - { mob: stray, count: 10 }

  - type: WAVE
    name: '&c第 12 层 · 巫后巢穴'
    spawns:
      - { mob: elite_witch, count: 5 }
      - { mob: witch, count: 8 }
      - { mob: cave_spider, count: 14 }

  - type: WAVE
    name: '&c第 13 层 · 熔火深渊'
    spawns:
      - { mob: blaze, count: 14 }
      - { mob: piglin, count: 14 }
      - { mob: creeper, count: 10 }

  - type: WAVE
    name: '&c第 14 层 · 屠戮竞技场'
    spawns:
      - { mob: elite_brute, count: 10 }
      - { mob: elite_piglin_brute, count: 4 }
      - { mob: silverfish, count: 20 }

  # ================= 第五幕 · 巫妖（15 层）=================
  - type: BOSS
    name: '&4&l第 15 层 · 巫妖之门'
    spawns:
      - { mob: boss_lich, count: 1 }
      - { mob: elite_witch, count: 4 }
      - { mob: elite_vex, count: 12 }

  # ================= 第六幕 · 深渊回响（16~18 层）=================
  - type: WAVE
    name: '&c第 16 层 · 虚空回响'
    spawns:
      - { mob: elite_vex, count: 16 }
      - { mob: elite_marksman, count: 10 }
      - { mob: elite_pillager, count: 6 }

  - type: WAVE
    name: '&c第 17 层 · 不朽军阵'
    spawns:
      - { mob: elite_ravager, count: 5 }
      - { mob: elite_piglin_brute, count: 8 }
      - { mob: elite_brute, count: 10 }

  - type: WAVE
    name: '&c第 18 层 · 霜与火'
    spawns:
      - { mob: elite_witch, count: 6 }
      - { mob: blaze, count: 12 }
      - { mob: stray, count: 14 }
      - { mob: elite_pillager, count: 6 }

  # ================= 第七幕 · 中期 BOSS（19~20 层）=================
  - type: BOSS
    name: '&4&l第 19 层 · 典狱长·觉醒'
    spawns:
      - { mob: boss_warden, count: 1 }
      - { mob: elite_ravager, count: 6 }
      - { mob: elite_piglin_brute, count: 8 }
      - { mob: elite_vex, count: 8 }

  - type: BOSS
    name: '&4&l第 20 层 · 终末之厅·极'
    spawns:
      # hp: 绝对血量覆盖 —— 200 万，不受 layer-health-step / boss-health-bonus 影响
      - { mob: boss_ravager, count: 1, hp: 2000000 }
      - { mob: elite_vex, count: 16 }
      - { mob: elite_witch, count: 6 }
      - { mob: elite_marksman, count: 10 }

  # ================= 第八幕 · 深渊试炼（21~25 层）=================
  - type: WAVE
    name: '&c第 21 层 · 弩炮狂潮'
    spawns:
      - { mob: elite_pillager, count: 14 }
      - { mob: elite_marksman, count: 12 }
      - { mob: archer, count: 10 }

  - type: WAVE
    name: '&c第 22 层 · 巫后议会'
    spawns:
      - { mob: elite_witch, count: 8 }
      - { mob: witch, count: 10 }
      - { mob: cave_spider, count: 14 }

  - type: WAVE
    name: '&c第 23 层 · 熔火炼狱'
    spawns:
      - { mob: blaze, count: 16 }
      - { mob: piglin, count: 16 }
      - { mob: creeper, count: 10 }

  - type: WAVE
    name: '&c第 24 层 · 破军竞技场'
    spawns:
      - { mob: elite_brute, count: 12 }
      - { mob: elite_piglin_brute, count: 8 }
      - { mob: elite_ravager, count: 5 }
      - { mob: silverfish, count: 20 }

  - type: BOSS
    name: '&4&l第 25 层 · 巫妖之怒'
    spawns:
      - { mob: boss_lich, count: 1 }
      - { mob: elite_witch, count: 6 }
      - { mob: elite_vex, count: 14 }

  # ================= 第九幕 · 终焉回响（26~28 层）=================
  - type: WAVE
    name: '&c第 26 层 · 虚空调停'
    spawns:
      - { mob: elite_vex, count: 18 }
      - { mob: elite_marksman, count: 12 }
      - { mob: elite_pillager, count: 8 }

  - type: WAVE
    name: '&c第 27 层 · 不朽终局'
    spawns:
      - { mob: elite_ravager, count: 8 }
      - { mob: elite_piglin_brute, count: 10 }
      - { mob: elite_brute, count: 12 }

  - type: WAVE
    name: '&c第 28 层 · 霜火绝境'
    spawns:
      - { mob: elite_witch, count: 8 }
      - { mob: blaze, count: 14 }
      - { mob: stray, count: 16 }
      - { mob: elite_pillager, count: 8 }

  # ================= 终幕 · 双首领（29~30 层）=================
  - type: BOSS
    name: '&4&l第 29 层 · 典狱长·终焉'
    spawns:
      - { mob: boss_warden, count: 1 }
      - { mob: elite_ravager, count: 8 }
      - { mob: elite_piglin_brute, count: 10 }
      - { mob: elite_vex, count: 10 }

  - type: BOSS
    name: '&4&l第 30 层 · 终末之厅·无上'
    spawns:
      # hp: 绝对血量覆盖 —— 300 万最终 BOSS，不受公式影响
      - { mob: boss_ravager, count: 1, hp: 3000000 }
      - { mob: elite_vex, count: 18 }
      - { mob: elite_witch, count: 8 }
      - { mob: elite_marksman, count: 12 }
