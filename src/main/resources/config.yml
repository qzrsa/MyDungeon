# ============================================================
#  MyDungeon 0.2.0 —— 副本挑战插件
# ------------------------------------------------------------
#  核心思路：副本内的战斗由本插件的伤害引擎接管。
#  玩家原有的全部属性（神化词缀、拔刀剑、原生附魔）都保留，
#  但"这些属性值多少钱"由下面的公式决定 —— 所以怪追得上、
#  玩家也不会再靠原版 80% 封顶 + 乘法叠加变成无敌。
#
#  副本世界运行在「真虚空生成器」上：不产生任何方块 / 结构 / 生物，
#  区块生成开销接近 0，也不会顺带刷新周围区块。场地由插件手工铺设。
# ============================================================

combat:
  # RPG 减伤公式：减伤率 = armor / (armor + K)
  # K 越大 → 护甲收益越低 → 怪越好打。想让玩家更"脆"就调大 K。
  armor-k: 100.0
  # 全局伤害倍率（玩家→怪、怪→玩家 都乘这个），整体调节奏用
  damage-multiplier: 1.0
  # 最小伤害，防止减伤后变成 0 导致完全没有手感
  min-damage: 1.0
  # 是否在副本内屏蔽神化（Apotheosis）的"伤害减免类"词缀。
  # 若实测发现减伤仍被叠乘、怪打不动，把这里改成 true 再 /dungeon reload。
  block-apoth-damage-reduction: false

# 怪物全局缩放 —— 手感调参主开关，不用改代码、不用重编译
mobs:
  health-scale: 1.0      # 怪血量倍率。嫌怪太脆 → 调到 1.5 / 2.0
  damage-scale: 1.0      # 怪伤害倍率

dungeon:
  world: dungeon_01      # 副本世界名（不存在会自动用虚空生成器创建）
  slots: 1               # 槽位数：结构支持多个，MVP 先用 1
  spawn: { x: 0.5, y: 66.0, z: 0.5 }   # 传送落点（副本世界坐标）
  boundary-radius: 60    # 玩家活动半径，超出会被拉回
  require-ticket: false  # 是否需要门票物品
  ticket-material: NETHER_STAR
  # 副本内死亡后是否直接送出副本（false = 原地复活，继续打）
  kick-on-death: false
  # 进入副本倒计时秒数（执行 /dungeon enter 后开始倒计时）
  enter-countdown: 5
  # 每层结束后的修整秒数
  rest-time: 30
  # 禁止副本内技能浮空（拔刀剑 Trick Up、空中缓降等）
  anti-float: true
  # 连续滞空超过该 tick 数即判定浮空并压回地面（20 tick = 1 秒，正常跳跃约 12 tick，不会误伤）
  anti-float-air-ticks: 15
  # 剩余怪数 <= 该值时给怪加发光，方便玩家找到最后几只（0 = 关闭）
  mob-glow-when-left: 5

arena:
  # 启动时自动生成测试场（虚空里铺地板 + 围墙 + 照明）
  auto-build: true
  size: 48               # 正方形场地边长（格）
  floor-y: 64            # 地板高度
  wall-height: 28        # 玻璃围墙高度（透明，顶部封玻璃天花板）
  clear-above: 44        # 地板上方清空高度（需大于墙高）

# 阶段与奖励配置文件名（位于插件数据目录 stages/ 与 rewards/ 下）
stages:
  dungeon1: dungeon1.yml
rewards:
  dungeon1: dungeon1.yml
