# ============================================================
#  MyDungeon 0.2.0 —— 副本挑战插件
# ------------------------------------------------------------
#  核心思路：副本内的战斗由本插件的伤害引擎接管。
#  玩家原有的全部属性（神化词缀、拔刀剑、原生附魔）都保留，
#  但"这些属性值多少钱"由下面的公式决定 —— 所以怪追得上、
#  玩家也不会再靠原版 80% 封顶 + 乘法叠加变成无敌。
#
#  副本世界运行在「真虚空生成器」上：不产生任何方块 / 结构 / 生物，
#  区块生成开销接近 0，也不会顺带刷新周围区块。场地由插件手工铺设。
# ============================================================

combat:
  # RPG 减伤公式：减伤率 = armor / (armor + K)
  # K 越大 → 护甲收益越低 → 怪越好打。想让玩家更"脆"就调大 K。
  armor-k: 100.0
  # 全局伤害倍率（玩家→怪、怪→玩家 都乘这个），整体调节奏用
  damage-multiplier: 1.0
  # 最小伤害，防止减伤后变成 0 导致完全没有手感
  min-damage: 1.0
  # 是否在副本内屏蔽神化（Apotheosis）的"伤害减免类"词缀。
  # 若实测发现减伤仍被叠乘、怪打不动，把这里改成 true 再 /dungeon reload。
  block-apoth-damage-reduction: false
  # ★ 怪身上「抗性提升 / 力量」每级折算多少。
  #   副本伤害由本插件引擎接管（用 setDamage 覆盖），原版不会自动应用这两个效果，
  #   所以必须在这里配 —— 否则 mobs.yml 里写了 resistance / strength 也完全白写。
  buff-resistance-per-level: 0.15   # 每级减伤 15%（I 级 -15%，II 级 -30%）
  buff-strength-per-level: 0.15     # 每级增伤 15%

# 怪物全局缩放 —— 手感调参主开关，不用改代码、不用重编译
mobs:
  health-scale: 1.0      # 怪血量倍率。嫌怪太脆 → 调到 1.5 / 2.0
  damage-scale: 1.0      # 怪伤害倍率
  # ★ 按层段保底血量（v0.4.1 起，取代原来的 layer-health-step）：
  #   hp = max(模板血 × health-scale, 该层段保底值)。
  #   「保底」= 血量不低于这个数：弱怪被抬到保底，精英怪保留更高的模板血。
  #   from = 起始层（1 起），取「不超过当前层的最大档」。
  health-floor:
    normal:                       # 普通怪保底
      - { from: 1,  hp: 50000 }    #  1~10 层：保底 5W
      - { from: 11, hp: 200000 }   # 11~20 层：保底 20W
      - { from: 21, hp: 300000 }   # 21~30 层：保底 30W
    boss:                         # BOSS 保底
      - { from: 1,  hp: 2000000 }  #  1~10 层：BOSS 200W
      - { from: 11, hp: 5000000 }  # 11~20 层：BOSS 500W
      - { from: 21, hp: 10000000 } # 21~30 层：BOSS 1000W
  # 下面两个键已由 health-floor 取代（保留向后兼容，但不再影响血量）。
  layer-health-step: 5000
  boss-health-bonus: 3.0
  # ★ 按层数档位给「所有怪」叠加的 buff（key = 起始层，取不超过当前层的最大档）。
  #   会和 mobs.yml 里模板自带的 buffs 合并，同一种效果取更高级别。
  #   等级从 0 起（0 = I 级）。可用：speed / resistance / strength / fire_resistance
  #   / regeneration / absorption / jump_boost / invisibility ...
  #   想更狠就继续加档位，例如再加一行 `19: { speed: 2, resistance: 1 }`
  tier-buffs:
    6:  { fire_resistance: 0 }                             # 6 层起：抗火
    11: { fire_resistance: 0, speed: 0 }                   # 11 层起：+ 速度 I
    16: { fire_resistance: 0, speed: 1, resistance: 0 }    # 16 层起：速度 II + 抗性 I

dungeon:
  world: dungeon_01      # 副本世界名（不存在会自动用虚空生成器创建）
  slots: 1               # 槽位数：结构支持多个，MVP 先用 1
  spawn: { x: 0.5, y: 66.0, z: 0.5 }   # 传送落点（副本世界坐标）
  boundary-radius: 60    # 玩家活动半径，超出会被拉回
  require-ticket: false  # 是否需要门票物品
  ticket-material: NETHER_STAR
  # ★ 副本内死亡 = 直接退出副本，复活点交给其他插件 / 原版接管（不再原地复活）
  # 进入副本倒计时秒数（执行 /dungeon enter 后开始倒计时，组队等待时间）
  enter-countdown: 30
  # 每层结束后的修整秒数
  rest-time: 30
  # 禁止副本内技能浮空（拔刀剑 Trick Up、空中缓降等）
  anti-float: true
  # ★ 副本内强制关闭飞行（含 mod 喷气背包）。Mekanism 等喷气背包的推力逻辑
  #   依赖 Abilities.flying == true 才触发，每 tick 硬关飞行能力即可让它失效。
  anti-fly: true
  # 连续滞空超过该 tick 数即判定浮空并压回地面（20 tick = 1 秒，正常跳跃约 12 tick，不会误伤）
  anti-float-air-ticks: 15
  # ★ 反浮空「强禁」：只要脚底离地超过这个高度（格）就持续向下压。
  #   拔刀剑剑技每 tick 用 setDeltaMovement 刷新速度，靠「滞空时长+下落速度」判断会漏掉，
  #   所以改成按「离地高度」硬判。0 = 关闭高度强压，退回旧逻辑。
  #   （v0.4.2 起额外加了 PlayerMoveEvent 落点钳制，见代码，二者叠加更稳）
  anti-float-max-height: 2.5
  # 强禁模式下每 tick 施加的向下速度（负值越大压得越狠，默认 -1.2）
  anti-float-pull-speed: -1.2
  # 判断「脚底离地」用的地面 Y（= 场地地板 y + 1；默认自动取 arena.floor-y + 1）
  anti-float-ground-y: 65
  # 剩余怪数 <= 该值时给怪加发光，方便玩家找到最后几只（0 = 关闭）
  mob-glow-when-left: 5

arena:
  # 启动时自动生成测试场（虚空里铺地板 + 围墙 + 照明）
  auto-build: true
  size: 48               # 正方形场地边长（格）
  floor-y: 64            # 地板高度
  wall-height: 28        # 玻璃围墙高度（透明，顶部封玻璃天花板）
  clear-above: 44        # 地板上方清空高度（需大于墙高）

# 副本内伤害统计计分板（右侧 sidebar）—— 只对副本成员生效，出本自动消失
scoreboard:
  enabled: true          # 总开关，false = 完全关闭伤害统计
  top: 8                 # 排行榜最多显示几名（注意：sidebar 总行数上限 15）
  refresh-ticks: 10      # 刷新间隔（20 tick = 1 秒，默认 10 = 0.5 秒）
  dps-window-seconds: 5  # 秒伤统计的滑动窗口（秒）
  # 标题支持 {layer} / {total} 占位符与 & 颜色码；用 \n 可换行
  title: '&6&l遗忘地窟 &7· &f第 {layer}/{total} 层'

# 阶段与奖励配置文件名（位于插件数据目录 stages/ 与 rewards/ 下）
stages:
  dungeon1: dungeon1.yml
rewards:
  dungeon1: dungeon1.yml
