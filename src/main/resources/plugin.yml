name: MyDungeon
version: 0.3.3
main: cn.qzrs.dungeon.MyDungeon
api-version: '1.21'
authors: [qzrs]
description: '副本挑战 —— 独立数值体系（自研伤害引擎 + 自定义怪）。19 种怪 / 10 层试炼 / 真虚空世界'
softdepend: [Multiverse-Core]
commands:
  dungeon:
    description: 副本挑战命令
    usage: /dungeon <enter|leave|info|reload>
    aliases: [dg, fuben]
permissions:
  dungeon.use:
    description: 允许进入副本
    default: true
  dungeon.build:
    description: 允许在副本世界内破坏/放置方块（建地图用）
    default: op
  dungeon.admin:
    description: 副本管理（reload / 强制结束）
    default: op
